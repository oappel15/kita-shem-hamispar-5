function showSlide(id){var d=data(),i=d.ids.indexOf(id);if(i<0)i=0,id=d.ids[0];$("#teacher-content").innerHTML='<h2>שקופית '+(i+1)+' מתוך '+d.ids.length+': '+d.labels[id]+'</h2>'+(d.notes[id]||"")+'<p class="small">החלון מתעדכן לבד כשעוברים שקופית במצגת.</p>';}
function unlock(){var d=data();$("#teacher-form").hidden=true;$("#teacher-content").hidden=false;try{sessionStorage.setItem(PFX+"TeacherOK","1");}catch(e){}
  if(pres){document.body.classList.add("presenter");var id=null;try{id=localStorage.getItem(PFX+"Slide");}catch(e){}showSlide(id);
    try{var bc=new BroadcastChannel("kita-shem-hamispar-5");bc.onmessage=function(e){if(e.data&&e.data.slide)showSlide(e.data.slide);};}catch(e){}
    addEventListener("storage",function(e){if(e.key===PFX+"Slide"&&e.newValue)showSlide(e.newValue);});}
  else{$("#teacher-content").innerHTML=d.content;var lb=$("#lock-btn");if(lb)lb.addEventListener("click",function(){try{sessionStorage.removeItem(PFX+"TeacherOK");}catch(e){}location.reload();});}}
$("#teacher-form").addEventListener("submit",function(e){e.preventDefault();var pw=$("#teacher-pw");if(pw.value.trim()==="1010"){$("#teacher-err").hidden=true;unlock();}else{$("#teacher-err").hidden=false;pw.value="";pw.focus();}});
try{if(sessionStorage.getItem(PFX+"TeacherOK")==="1")unlock();}catch(e){}
})();
</script></body></html>
